name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  typescript-slice:
    name: TypeScript slice (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (typed, scoped to the TS slice)
        run: bun run lint:types

      - name: Test the TS slice
        run: bun run test:bun

  node-tests:
    name: Node test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.15"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
