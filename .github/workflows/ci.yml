name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  typescript-slice:
    name: TypeScript slice (Bun)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mindcraft
          POSTGRES_PASSWORD: mindcraft
          POSTGRES_DB: mindcraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindcraft"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://mindcraft:mindcraft@localhost:5432/mindcraft
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (typed, scoped to the TS slice)
        run: bun run lint:types

      - name: Apply migrations
        run: bun run db:migrate

      - name: Test the TS slice (incl. Postgres integration)
        run: bun run test:bun

  node-tests:
    name: Node test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.15"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
