<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mindcraft — LLM Audit</title>
    <script src="/llm_audit.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0e1210;
            --panel: #131916;
            --card: #1a221e;
            --inset: #0b100e;
            --border: #29342f;
            --strong: #405047;
            --text: #e8efe9;
            --dim: #94a39a;
            --mute: #617067;
            --lime: #9fe870;
            --lime-bg: rgba(159, 232, 112, .12);
            --amber: #f0b429;
            --amber-bg: rgba(240, 180, 41, .13);
            --red: #ef6a67;
            --cyan: #63d2ca;
            --font: "DM Sans", system-ui, sans-serif;
            --mono: "JetBrains Mono", ui-monospace, monospace;
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.5 var(--font);
            display: flex;
            flex-direction: column;
        }
        button, input, select { font: inherit; }
        .topbar {
            min-height: 57px;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 10px 18px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: baseline; gap: 8px; }
        .brand h1 { margin: 0; font-size: 1.05rem; }
        .tag, .status, .eyebrow, .meta, .count, .badge {
            font-family: var(--mono);
        }
        .tag { color: var(--amber); font-size: .67rem; letter-spacing: .08em; text-transform: uppercase; }
        nav { display: flex; gap: 3px; }
        nav a {
            color: var(--dim);
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 7px;
            font-size: .82rem;
        }
        nav a:hover { color: var(--text); }
        nav a.active { color: var(--amber); background: var(--amber-bg); }
        .toolbar { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .search, .select {
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 9px;
        }
        .search { width: 190px; }
        .search:focus, .select:focus { outline: none; border-color: var(--strong); }
        .status { color: var(--mute); font-size: .68rem; }
        .status.live { color: var(--lime); }
        .layout {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 250px 350px minmax(0, 1fr);
            gap: 1px;
            background: var(--border);
        }
        .pane {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }
        .pane-head {
            min-height: 45px;
            padding: 9px 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        .pane-head h2 {
            margin: 0;
            color: var(--dim);
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .09em;
        }
        .count { margin-left: auto; color: var(--mute); font-size: .66rem; }
        .pane-action {
            max-width: 118px;
            margin-left: auto;
            color: var(--dim);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 4px 6px;
            font-size: .7rem;
        }
        .pane-action:disabled { opacity: .45; }
        .pane-body { flex: 1; overflow: auto; min-height: 0; }
        .row {
            width: 100%;
            display: block;
            padding: 11px 13px;
            color: inherit;
            background: transparent;
            border: 0;
            border-left: 2px solid transparent;
            border-bottom: 1px solid var(--border);
            text-align: left;
            cursor: pointer;
        }
        .row:hover { background: var(--panel); }
        .row.selected { background: var(--card); border-left-color: var(--lime); }
        .row-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .row-title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta { color: var(--mute); font-size: .65rem; margin-top: 2px; }
        .preview { color: var(--dim); font-size: .78rem; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge {
            flex: none;
            color: var(--dim);
            border: 1px solid var(--strong);
            border-radius: 999px;
            padding: 1px 6px;
            font-size: .58rem;
            text-transform: uppercase;
        }
        .badge.complete { color: var(--lime); border-color: var(--lime); }
        .badge.pending { color: var(--amber); border-color: var(--amber); }
        .badge.error { color: var(--red); border-color: var(--red); }
        .category-state {
            flex: none;
            color: var(--mute);
            font: .55rem var(--mono);
            text-transform: uppercase;
        }
        .category-state.pending { color: var(--amber); }
        .category-state.reviewed { color: var(--lime); }
        .category-state.archived { color: var(--cyan); }
        .agent-count {
            min-width: 26px;
            text-align: center;
            color: var(--lime);
            background: var(--lime-bg);
            border-radius: 999px;
            font: .65rem var(--mono);
            padding: 2px 6px;
        }
        .detail { padding: 18px 20px 50px; }
        .detail-title { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
        .detail-title h2 { margin: 0; font-size: 1.2rem; }
        .detail-title .actions { margin-left: auto; display: flex; gap: 7px; }
        .button {
            color: var(--dim);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 5px 9px;
            cursor: pointer;
        }
        .button:hover { color: var(--text); border-color: var(--strong); }
        .button.danger { color: var(--red); }
        .facts {
            display: grid;
            grid-template-columns: repeat(4, minmax(100px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }
        .fact { padding: 9px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
        .eyebrow { color: var(--mute); font-size: .59rem; text-transform: uppercase; letter-spacing: .08em; }
        .fact-value { margin-top: 2px; overflow-wrap: anywhere; }
        details {
            margin-top: 9px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--panel);
            overflow: hidden;
        }
        summary {
            cursor: pointer;
            padding: 10px 12px;
            font-weight: 600;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        summary::-webkit-details-marker { display: none; }
        summary::before { content: "›"; color: var(--lime); font: 1rem var(--mono); }
        details[open] summary::before { transform: rotate(90deg); }
        .section-body { border-top: 1px solid var(--border); padding: 12px; background: var(--inset); }
        pre {
            margin: 0;
            color: #d7e1da;
            font: .76rem/1.55 var(--mono);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .message { display: grid; grid-template-columns: 85px minmax(0, 1fr); gap: 11px; padding: 10px 0; border-top: 1px solid var(--border); }
        .message:first-child { border-top: 0; padding-top: 0; }
        .role { color: var(--cyan); font: .69rem var(--mono); text-transform: uppercase; }
        .message.assistant .role { color: var(--lime); }
        .message.system .role { color: var(--amber); }
        .content { white-space: pre-wrap; overflow-wrap: anywhere; }
        .response { border-left: 2px solid var(--lime); padding-left: 12px; }
        .error-text { color: var(--red); }
        .empty { color: var(--mute); padding: 24px 16px; font-style: italic; }
        .image { display: block; max-width: 100%; border-radius: 7px; }
        @media (max-width: 1050px) {
            .layout { grid-template-columns: 210px 300px minmax(0, 1fr); }
            .facts { grid-template-columns: repeat(2, minmax(100px, 1fr)); }
            nav { display: none; }
        }
        @media (max-width: 760px) {
            .layout { display: block; overflow: auto; }
            .pane { min-height: 280px; }
            .toolbar .search { width: 120px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand"><h1>LLM Audit</h1><span class="tag">complete context</span></div>
        <nav aria-label="Main views">
            <a href="/">Home</a>
            <a href="/games">Games</a>
            <a href="/survivor">Survivor</a>
            <a href="/conversations">Conversations</a>
            <a href="/llm-audit" class="active" aria-current="page">LLM Audit</a>
            <a href="/seasons">Archive</a>
            <a href="/colony">Colony</a>
        </nav>
        <div class="toolbar">
            <select id="kindFilter" class="select" aria-label="Filter by call type"><option value="">All calls</option></select>
            <input id="search" class="search" type="search" placeholder="Search context…" aria-label="Search audits">
            <span id="status" class="status">loading</span>
        </div>
    </header>
    <main class="layout">
        <aside class="pane">
            <div class="pane-head">
                <h2>Categories</h2>
                <span id="agentCount" class="count"></span>
                <select id="categoryAction" class="pane-action" aria-label="Manage selected category" disabled>
                    <option value="">Manage…</option>
                    <option value="rename">Rename label</option>
                    <option value="pending">Mark pending</option>
                    <option value="reviewed">Mark reviewed</option>
                    <option value="unreviewed">Mark unreviewed</option>
                    <option value="archived">Archive</option>
                    <option value="note">Add or edit note</option>
                    <option value="delete">Delete category</option>
                </select>
            </div>
            <div id="agents" class="pane-body"></div>
        </aside>
        <section class="pane">
            <div class="pane-head"><h2 id="callsTitle">Calls</h2><span id="callCount" class="count"></span></div>
            <div id="calls" class="pane-body"></div>
        </section>
        <section class="pane">
            <div class="pane-head"><h2>Exact request</h2><span id="detailCount" class="count"></span></div>
            <div id="detail" class="pane-body"><div class="empty">Select a call to inspect everything sent to the model.</div></div>
        </section>
    </main>
</body>
</html>
