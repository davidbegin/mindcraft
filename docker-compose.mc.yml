services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: mindcraft-mc
    ports:
      - "55916:25565"
    environment:
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      MODE: survival
      DIFFICULTY: normal
      VERSION: "1.21.6"
      LEVEL: mindcraft-colony-survival-v1
      MEMORY: 2G
      SPAWN_PROTECTION: 0
      VIEW_DISTANCE: 8
      MOTD: "Mindcraft Persistent Survival Colony"
    volumes:
      - mindcraft-mc-data:/data
    restart: unless-stopped

volumes:
  mindcraft-mc-data:
