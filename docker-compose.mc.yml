services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: mindcraft-mc
    ports:
      # Localhost only — do not publish on the LAN.
      - "127.0.0.1:55916:25565"
    environment:
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      MODE: survival
      DIFFICULTY: normal
      # Fabric + FabricTailor provide per-bot custom skins on this offline server.
      TYPE: FABRIC
      VERSION: "1.21.6"
      MODRINTH_PROJECTS: fabrictailor
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      LEVEL: mindcraft-colony-survival-v1
      MEMORY: 2G
      SPAWN_PROTECTION: 0
      VIEW_DISTANCE: 8
      MOTD: "Mindcraft Persistent Survival Colony"
    volumes:
      - mindcraft-mc-data:/data
      # Generated bot skins; FabricTailor reads them via `/skin set upload`.
      - ./skins:/skins:ro
    restart: unless-stopped

volumes:
  mindcraft-mc-data:
